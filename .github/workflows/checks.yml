name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Unit and helper integration tests
        run: uv run --no-project --no-config python -B -m unittest discover -s tests -v
      - name: Lint and formatting
        run: |
          uvx ruff@0.16.5 check .
          uvx ruff@0.16.5 format --check .
      - name: Type check
        run: uvx pyright@1.1.413
      - name: Whitespace check
        run: git diff-tree --check --root HEAD
